# Managed PEYVAND standalone path. Included only by quantiviq.xyz HTTPS.
location = /peyvand {
    include /etc/nginx/snippets/peyvand-headers.conf;
    return 308 /peyvand/;
}
location = /peyvand/404.html {
    internal;
    alias /var/www/peyvand/current/404.html;
    include /etc/nginx/snippets/peyvand-headers.conf;
}
location = /peyvand/verified-manifest.json {
    include /etc/nginx/snippets/peyvand-headers.conf;
    error_page 404 /peyvand/404.html;
    return 404;
}
location ^~ /peyvand/404/ {
    include /etc/nginx/snippets/peyvand-headers.conf;
    error_page 404 /peyvand/404.html;
    return 404;
}
location ^~ /peyvand/ {
    alias /var/www/peyvand/current/;
    index index.html;
    autoindex off;
    error_page 403 404 /peyvand/404.html;
    include /etc/nginx/snippets/peyvand-headers.conf;
}
