# Independent PEYVAND host. Never a default server and never an alias on Quantiviq.
server {
    listen 80;
    listen [::]:80;
    server_name peyvand.quantiviq.xyz;
    if ($host != "peyvand.quantiviq.xyz") { return 404; }

    root /var/www/peyvand/current;
    index index.html;
    error_page 404 /404.html;
    include /etc/nginx/snippets/peyvand-headers.conf;

    location = /404.html { internal; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/peyvand/acme;
        default_type text/plain;
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /verified-manifest.json { return 404; }
    location ~ (^|/)\. { return 404; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
