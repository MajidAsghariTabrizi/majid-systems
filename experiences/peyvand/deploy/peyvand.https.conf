server {
    listen 80;
    listen [::]:80;
    server_name peyvand.quantiviq.xyz;
    if ($host != "peyvand.quantiviq.xyz") { return 404; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/peyvand/acme;
        default_type text/plain;
    }
    location / { return 301 https://peyvand.quantiviq.xyz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name peyvand.quantiviq.xyz;
    if ($host != "peyvand.quantiviq.xyz") { return 404; }

    ssl_certificate /etc/letsencrypt/live/peyvand.quantiviq.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peyvand.quantiviq.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/peyvand/current;
    index index.html;
    error_page 404 /404.html;
    include /etc/nginx/snippets/peyvand-headers.conf;

    location = /404.html { internal; }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /verified-manifest.json { return 404; }
    location ~ (^|/)\. { return 404; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
