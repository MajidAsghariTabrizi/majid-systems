# =============================================================
# quantiviq.xyz
#   /                -> Personal Engineering Portfolio (Next.js)
#   /smart-trader/   -> SmartTrader dashboard / pages / API
# =============================================================

# ---------- HTTP -> HTTPS redirect (apex + www) ----------
server {
    listen 80;
    listen [::]:80;
    server_name quantiviq.xyz www.quantiviq.xyz;

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location /.well-known/pki-validation/ { root /var/www/html; allow all; }

    location / { return 301 https://$host$request_uri; }
}

# ---------- www -> apex (HTTPS) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.quantiviq.xyz;

    ssl_certificate     /etc/letsencrypt/live/quantiviq.xyz-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantiviq.xyz-0002/privkey.pem;

    return 301 https://quantiviq.xyz$request_uri;
}

# ---------- apex (HTTPS) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quantiviq.xyz;

    ssl_certificate     /etc/letsencrypt/live/quantiviq.xyz-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantiviq.xyz-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location /.well-known/pki-validation/ { root /var/www/html; allow all; }

    # ============================================================
    # SmartTrader  (preserved at /smart-trader/...)
    # ============================================================
    # 1) API
    location ^~ /smart-trader/api/ {
        rewrite ^/smart-trader/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /smart-trader;
    }

    # 2) Static assets (css/js) under /smart-trader/static
    location ^~ /smart-trader/static/ {
        alias /root/smart-trader/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 3) SmartTrader HTML pages
    #    /smart-trader/         -> /root/smart-trader/static/pages/dashboard.html (default landing)
    #    /smart-trader/dashboard-> /root/smart-trader/static/pages/dashboard.html
    #    /smart-trader/landing  -> /root/smart-trader/static/pages/landing.html
    #    ...
    #    /smart-trader/owner    -> /root/smart-trader/static/pages/owner.html
    #    Also rewrite absolute paths in the HTML so the assets resolve.
    location ^~ /smart-trader/ {
        rewrite ^/smart-trader/$   /pages/dashboard.html break;
        rewrite ^/smart-trader$    /pages/dashboard.html break;
        rewrite ^/smart-trader/([a-zA-Z0-9_-]+)$  /pages/$1.html break;
        rewrite ^/smart-trader/([a-zA-Z0-9_-]+)/$ /pages/$1.html break;
        root /root/smart-trader/static;

        sub_filter_once off;
        sub_filter_types application/javascript text/css;
        sub_filter 'href="/landing"'  'href="/smart-trader/landing"';
        sub_filter 'href="/login"'    'href="/smart-trader/login"';
        sub_filter 'href="/register"' 'href="/smart-trader/register"';
        sub_filter 'href="/pricing"'  'href="/smart-trader/pricing"';
        sub_filter 'href="/insights"' 'href="/smart-trader/insights"';
        sub_filter 'href="/app"'      'href="/smart-trader/app"';
        sub_filter 'href="/owner"'    'href="/smart-trader/owner"';
        sub_filter 'href="/dashboard"' 'href="/smart-trader/dashboard"';
        sub_filter 'href="/"'         'href="/smart-trader/"';
        sub_filter "href=\"/static/"  "href=\"/smart-trader/static/";
        sub_filter "href='/static/"   "href='/smart-trader/static/";
        sub_filter "src=\"/static/"   "src=\"/smart-trader/static/";
        sub_filter "src='/static/"    "src='/smart-trader/static/";
        sub_filter "\"/api/"          "\"/smart-trader/api/";
        sub_filter "'/api/"           "'/smart-trader/api/";
        sub_filter "fetch(\"/api/"    "fetch(\"/smart-trader/api/";
        sub_filter "fetch('/api/"     "fetch('/smart-trader/api/";
    }

    # ============================================================
    # Personal Engineering Portfolio (Next.js)
    # ============================================================
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
